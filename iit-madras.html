<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IIT Madras — KalviPortal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟧</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Baloo+Thambi+2:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Mukta+Malar:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body class="theme-orange" data-college="iit-madras" data-nav="colleges">

  <!-- 🟧 UNIQUE UI #2 : FULL-SCREEN HERO (orange theme) -->
  <div class="hero hero-full" style="background-image:url('images/college-orange.jpg')">
    <div class="wrap">
      <span class="badge feat"><span data-i18n="featured_campus"></span> · NIRF #1</span>
      <h1 class="big-title" style="color:#fff"><span data-fill="name">IIT Madras</span></h1>
      <p style="max-width:660px;font-weight:600" data-fill="oneliner"></p>
      <div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap">
        <button class="btn yellow" data-favbtn></button>
        <a class="btn ghost" style="border-color:#fff;color:#fff" data-fill="maplink" target="_blank" data-i18n="open_maps"></a>
      </div>
    </div>
  </div>

  <!-- fact strip overlapping -->
  <div class="wrap stats-strip" style="margin-top:-32px">
    <div class="card stat reveal"><b data-fill="founded">1959</b><span data-i18n="established"></span></div>
    <div class="card stat reveal"><b data-fill="rating">4.9</b><span data-i18n="rating_l"></span></div>
    <div class="card stat reveal"><b data-fill="seats">2,500+</b><span data-i18n="seats_l"></span></div>
    <div class="card stat reveal"><b data-fill="city">Chennai</b><span data-i18n="location_l"></span></div>
  </div>

  <!-- ABOUT + HIGHLIGHTS -->
  <section class="block wrap">
    <div class="sec-head">
      <div>
        <span class="kicker"><span class="dot bg-orange"></span> <span data-i18n="why_iit_kicker"></span></span>
        <h2 data-i18n="why_iit"></h2>
        <div class="color-strip"></div>
      </div>
    </div>
    <div class="grid c2" style="align-items:start">
      <p class="sub reveal" style="font-size:.97rem" data-fill="about"></p>
      <div class="grid c3" data-fill="highlights"></div>
    </div>
  </section>

  <!-- PROGRAMS / DEPARTMENTS -->
  <section class="block" style="background:var(--cream-2)">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <span class="kicker"><span class="dot bg-red"></span> <span data-i18n="prog_kicker"></span></span>
          <h2 data-i18n="prog_t"></h2>
          <div class="color-strip"></div>
        </div>
      </div>
      <div class="grid c3" data-fill="departments"></div>
      <div style="text-align:center;margin-top:22px"><span class="hbadge"><span data-i18n="courses_lbl"></span> </span><span data-fill="tags"></span></div>
    </div>
  </section>

  <!-- EVENTS -->
  <section class="block wrap">
    <div class="sec-head">
      <div>
        <span class="kicker"><span class="dot bg-yellow"></span> <span data-i18n="events_kicker"></span></span>
        <h2 data-i18n="events_t2"></h2>
        <div class="color-strip"></div>
      </div>
    </div>
    <div class="grid c2" data-fill="events"></div>
  </section>

  <!-- GALLERY + REVIEWS side by side -->
  <section class="block" style="background:var(--cream-2)">
    <div class="wrap">
      <div class="grid c2" style="align-items:start">
        <div>
          <div class="sec-head">
            <div>
              <span class="kicker"><span class="dot bg-orange"></span> <span data-i18n="gallery_kicker"></span></span>
              <h2 data-i18n="gallery_t2"></h2>
            </div>
          </div>
          <div class="gallery" style="grid-template-columns:repeat(2,1fr)" data-fill="gallery"></div>
        </div>
        <div>
          <div class="sec-head">
            <div>
              <span class="kicker"><span class="dot bg-red"></span> <span data-i18n="voice_kicker"></span></span>
              <h2><span data-i18n="reviews_t"></span> (<span data-fill="reviewscount"></span>)</h2>
            </div>
          </div>
          <div class="grid" id="revList"></div>
          <div class="card" style="padding:22px;margin-top:15px">
            <h3 style="font-size:1.1rem" data-i18n="rev_form_t"></h3>
            <form id="revForm" style="margin-top:11px">
              <div class="star-pick" style="margin-bottom:9px">
                <button type="button" class="on">★</button><button type="button" class="on">★</button><button type="button" class="on">★</button><button type="button" class="on">★</button><button type="button" class="on">★</button>
              </div>
              <div class="field"><textarea rows="3" data-i18n-ph="rev_ph"></textarea></div>
              <button class="btn sm"><i class="fa-solid fa-star"></i> <span data-i18n="submit_review"></span></button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- MAP -->
  <section class="block wrap">
    <div class="sec-head">
      <div>
        <span class="kicker"><span class="dot bg-orange"></span> <span data-i18n="map_kicker"></span></span>
        <h2 data-i18n="map_t"></h2>
        <p class="sub" data-fill="mapsub" data-mapsub-key="map_sub_iit"></p>
      </div>
      <a class="btn sm yellow" data-fill="maplink" target="_blank" data-i18n="open_maps2"></a>
    </div>
    <div class="map-frame" data-fill="mapframe"></div>
  </section>

  <div class="overlay" id="quickOverlay"><div class="modal"><button class="close-x" onclick="closeModals()">✕</button><div id="quickBody"></div></div></div>

  <script src="js/data.js?v=16"></script>
  <script src="js/i18n.js?v=16"></script>
  <script src="js/app.js?v=16"></script>
  <script src="js/college.js?v=16"></script>
</body>
</html>
