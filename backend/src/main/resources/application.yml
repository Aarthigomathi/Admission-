server:
  port: 8080

spring:
  datasource:
    # Durable local development database. Override these variables for MySQL deployments.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/tn_colleges}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:3000}
  bootstrap:
    platform-admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    demo-student:
      email: ${APP_BOOTSTRAP_STUDENT_EMAIL:}
      password: ${APP_BOOTSTRAP_STUDENT_PASSWORD:}

logging:
  level:
    com.tncolleges: ${APP_LOG_LEVEL:INFO}
