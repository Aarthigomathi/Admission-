# ===== KalviPortal backend =====
server.port=8085

# MySQL — create the database first:  CREATE DATABASE kalviportal;
# (change user/password to match your local MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/kalviportal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false
