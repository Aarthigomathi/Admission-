<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KalviPortal — Sign Up / Sign In</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Baloo+Thambi+2:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Mukta+Malar:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>
  <div class="topbar"></div>

  <!-- fullscreen AI image background layer (original campus image — as-is) -->
  <div class="auth-bg"><img src="images/hero.jpg?v=11" alt=""></div>

  <!-- FULL SCREEN background image + ONLY the login card -->
  <div class="auth-layout">
    <div class="lang-float" id="authLang"></div>

    <div class="auth-center">
      <div class="auth-brand"><i class="fa-solid fa-graduation-cap"></i> KalviPortal</div>
      <p class="auth-brand-sub" data-i18n="auth_title"></p>

      <div class="auth-card">
        <div class="auth-tabs">
          <button id="tabSignin" class="on" data-i18n="tab_signin"></button>
          <button id="tabSignup" data-i18n="tab_signup"></button>
        </div>

        <!-- SIGN IN -->
        <form id="signinForm">
          <div class="field">
            <label><i class="fa-regular fa-envelope"></i> <span data-i18n="lbl_email"></span></label>
            <input type="email" id="siEmail" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label><i class="fa-solid fa-lock"></i> <span data-i18n="lbl_pass"></span></label>
            <input type="password" id="siPass" placeholder="••••••••" required>
          </div>
          <button class="btn block" data-i18n="btn_signin"></button>
          <p class="auth-msg" id="siMsg"></p>
          <p style="text-align:center;font-size:.85rem;color:var(--ink-soft);font-weight:600"><span data-i18n="new_user"></span> <b class="txt-orange" style="cursor:pointer" onclick="document.getElementById('tabSignup').click()" data-i18n="new_cta"></b></p>
        </form>

        <!-- SIGN UP -->
        <form id="signupForm" style="display:none">
          <div class="field">
            <label><i class="fa-regular fa-user"></i> <span data-i18n="lbl_name"></span></label>
            <input type="text" id="suName" data-i18n-ph="ph_name" required>
          </div>
          <div class="field">
            <label><i class="fa-regular fa-envelope"></i> <span data-i18n="lbl_email"></span></label>
            <input type="email" id="suEmail" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label><i class="fa-solid fa-lock"></i> <span data-i18n="lbl_pass"></span> <small data-i18n="pass_hint"></small></label>
            <input type="password" id="suPass" placeholder="••••••••" required>
          </div>
          <div class="field">
            <label><i class="fa-solid fa-location-dot"></i> <span data-i18n="lbl_city"></span></label>
            <select id="suCity" required>
              <option value="" data-i18n="city_ph"></option>
            </select>
          </div>
          <div class="field">
            <label><i class="fa-solid fa-book-open"></i> <span data-i18n="lbl_level"></span></label>
            <div class="level-pick">
              <label><input type="radio" name="suLevel" value="10th done"><span><i class="fa-solid fa-school"></i><br><span data-i18n="level_10"></span></span></label>
              <label><input type="radio" name="suLevel" value="12th done"><span><i class="fa-solid fa-user-graduate"></i><br><span data-i18n="level_12"></span></span></label>
              <label><input type="radio" name="suLevel" value="PG / Degree"><span><i class="fa-solid fa-rocket"></i><br><span data-i18n="level_pg"></span></span></label>
            </div>
          </div>
          <button class="btn block" data-i18n="btn_create"></button>
          <p class="auth-msg" id="suMsg"></p>
        </form>
      </div>
    </div>
  </div>

  <script src="js/data.js?v=16"></script>
  <script src="js/i18n.js?v=16"></script>
  <script src="js/app.js?v=16"></script>
  <script src="js/auth.js?v=16"></script>
  <script>
    /* auth page la navbar illa, so floating language toggle */
    document.getElementById("authLang").innerHTML = langToggleHTML();
  </script>
</body>
</html>
