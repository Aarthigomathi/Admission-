<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KalviPortal — Tamil Nadu District College Atlas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Baloo+Thambi+2:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Mukta+Malar:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=17">
</head>
<body>

  <section class="block wrap atlas">
    <div class="sec-head">
      <div>
        <span class="kicker"><span class="dot bg-orange"></span> <span data-i18n="atlas_kicker"></span></span>
        <h2 data-i18n="atlas_t"></h2>
        <div class="color-strip"></div>
        <p class="sub" style="margin-top:9px" data-i18n="atlas_sub"></p>
      </div>
      <div class="atlas-stat">
        <b id="stateTotal">…</b>
        <span data-i18n="state_total_label"></span>
        <small data-i18n="state_total_note"></small>
      </div>
    </div>

    <div class="atlas-legend">
      <span class="lg-item"><span class="lg-dot dot-eng"></span><i class="fa-solid fa-gears"></i> <span data-i18n="eng_word"></span></span>
      <span class="lg-item"><span class="lg-dot dot-arts"></span><i class="fa-solid fa-book-open"></i> <span data-i18n="arts_word"></span></span>
      <span class="lg-item"><span class="lg-dot dot-med"></span><i class="fa-solid fa-stethoscope"></i> <span data-i18n="med_word"></span></span>
      <span class="lg-item"><span class="lg-dot dot-poly"></span><i class="fa-solid fa-screwdriver-wrench"></i> <span data-i18n="poly_word"></span></span>
    </div>

    <div class="atlas-grid" id="atlasGrid"></div>

    <p class="approx-note"><i class="fa-solid fa-circle-info"></i> <span data-i18n="approx_note"></span></p>
  </section>

  <script src="js/data.js?v=17"></script>
  <script src="js/i18n.js?v=17"></script>
  <script src="js/app.js?v=17"></script>
  <script src="js/districts.js?v=17"></script>
</body>
</html>
