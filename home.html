<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KalviPortal — Home</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Baloo+Thambi+2:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Mukta+Malar:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=17">
</head>
<body>

  <!-- ══════════ PRO HERO with image collage ══════════ -->
  <div class="pro-hero">
    <div class="wrap">
      <div>
        <span class="pro-kicker"><span class="live"></span> <span id="greetLine" data-i18n="pro_kicker"></span></span>
        <h1 class="pro-title"><span data-i18n="hero_h1a"></span><br><span class="grad" data-i18n="hero_h1b"></span> <span class="mark">🎓</span></h1>
        <p class="pro-sub" id="heroSub" data-i18n="hero_sub_pro"></p>
        <div style="display:flex;gap:12px;margin-top:26px;flex-wrap:wrap">
          <a href="colleges.html" class="btn" data-i18n="btn_browse"></a>
          <button class="btn yellow" id="quizOpen" data-i18n="btn_quiz"></button>
          <a href="courses.html" class="btn ghost" data-i18n="nav_courses"></a>
        </div>
        <div class="pro-trust">
          <div class="faces">
            <span class="avatar">அ</span><span class="avatar">K</span><span class="avatar">P</span><span class="avatar">S</span>
          </div>
          <small><span class="stars">★★★★★</span> <span data-i18n="trust_note"></span></small>
        </div>
      </div>
      <div class="collage">
        <img class="main" src="images/hero.jpg?v=11" alt="Campus">
        <img class="fl fl1" src="images/login-bg.jpg?v=11" alt="Studying">
        <img class="fl fl2" src="images/events.jpg?v=11" alt="Events">
        <span class="chip chip1" data-i18n="chip_rating"></span>
        <span class="chip chip2" data-i18n="chip_colleges"></span>
        <span class="chip chip3" data-i18n="chip_districts"></span>
      </div>
    </div>
  </div>

  <!-- ══════════ SCROLLING MARQUEE ══════════ -->
  <div class="marquee"><div class="marquee-track" id="marqueeTrack"></div></div>

  <!-- STATS -->
  <div class="wrap stats-strip">
    <div class="card stat reveal"><b data-count="24" id="statColleges">0</b><span data-i18n="stat_colleges"></span></div>
    <div class="card stat reveal"><b data-count="32" id="statCourses">0</b><span data-i18n="stat_courses"></span></div>
    <div class="card stat reveal"><b data-count="38" id="statCities">0</b><span data-i18n="stat_cities"></span></div>
    <div class="card stat reveal"><b data-count="20000" data-suffix="+" id="statReviews">0</b><span data-i18n="stat_reviews"></span></div>
  </div>

  <!-- ══════════ HOW IT WORKS ══════════ -->
  <section class="block wrap">
    <div class="sec-head">
      <div>
        <span class="kicker"><span class="dot bg-red"></span> <span data-i18n="how_kicker"></span></span>
        <h2 data-i18n="how_t"></h2>
        <div class="color-strip"></div>
      </div>
    </div>
    <div class="steps">
      <div class="card step reveal"><span class="n">01</span><span class="ic">🔎</span><h3 data-i18n="step1_t"></h3><p data-i18n="step1_d"></p></div>
      <div class="card step reveal" style="transition-delay:90ms"><span class="n">02</span><span class="ic">⚖️</span><h3 data-i18n="step2_t"></h3><p data-i18n="step2_d"></p></div>
      <div class="card step reveal" style="transition-delay:180ms"><span class="n">03</span><span class="ic">🗺️</span><h3 data-i18n="step3_t"></h3><p data-i18n="step3_d"></p></div>
    </div>
  </section>

  <!-- 10th / 12th / PG -->
  <section class="block" style="background:var(--cream-2)">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <span class="kicker"><span class="dot bg-orange"></span> <span data-i18n="kicker_start"></span></span>
          <h2 data-i18n="level_title"></h2>
          <div class="color-strip"></div>
        </div>
      </div>
      <div class="grid c3">
        <a class="card level-card level-red reveal" href="courses.html?level=10">
          <span class="num">10</span><div class="ic">🏫</div>
          <h3 data-i18n="lvl10_t"></h3><p data-i18n="lvl10_d"></p><span class="go" data-i18n="go_txt"></span>
        </a>
        <a class="card level-card level-orange reveal" href="courses.html?level=12" style="transition-delay:80ms">
          <span class="num">12</span><div class="ic">🎓</div>
          <h3 data-i18n="lvl12_t"></h3><p data-i18n="lvl12_d"></p><span class="go" data-i18n="go_txt"></span>
        </a>
        <a class="card level-card level-yellow reveal" href="courses.html?level=pg" style="transition-delay:160ms">
          <span class="num">PG</span><div class="ic">🚀</div>
          <h3 data-i18n="lvlpg_t"></h3><p data-i18n="lvlpg_d"></p><span class="go" data-i18n="go_txt"></span>
        </a>
      </div>
    </div>
  </section>

  <!-- NEARBY -->
  <section class="block wrap">
    <div class="sec-head">
      <div>
        <span class="kicker"><span class="dot bg-orange"></span> <span data-i18n="kicker_area"></span></span>
        <h2 id="nearbyTitle">📍 Nearby colleges</h2>
        <div class="color-strip"></div>
      </div>
      <a href="colleges.html" class="btn sm ghost" data-i18n="all_colleges"></a>
    </div>
    <div class="grid c3" id="nearbyGrid"></div>
  </section>

  <!-- LEADERBOARD + EVENTS -->
  <section class="block" style="background:var(--cream-2)">
    <div class="wrap">
      <div class="grid c2" style="align-items:start">
        <div>
          <div class="sec-head">
            <div>
              <span class="kicker"><span class="dot bg-red"></span> <span data-i18n="lead_kicker"></span></span>
              <h2 data-i18n="lead_t"></h2>
              <div class="color-strip"></div>
            </div>
          </div>
          <div class="grid" id="leadGrid"></div>
        </div>
        <div>
          <div class="sec-head">
            <div>
              <span class="kicker"><span class="dot bg-yellow"></span> <span data-i18n="ev_kicker"></span></span>
              <h2 data-i18n="ev_t"></h2>
              <div class="color-strip"></div>
            </div>
          </div>
          <div class="grid" id="evGrid"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- FEATURED 3 -->
  <section class="block wrap">
    <div class="sec-head">
      <div>
        <span class="kicker"><span class="dot bg-yellow"></span> <span data-i18n="kicker_featured"></span></span>
        <h2 data-i18n="feat_title"></h2>
        <div class="color-strip"></div>
        <p class="sub" style="margin-top:9px" data-i18n="feat_sub"></p>
      </div>
    </div>
    <div class="grid c3" id="featuredGrid"></div>
  </section>

  <!-- CAREER CHIPS -->
  <section class="block" style="background:var(--cream-2);text-align:center">
    <div class="wrap">
      <span class="kicker"><span class="dot bg-red"></span> <span data-i18n="career_kicker"></span></span>
      <h2 data-i18n="career_t"></h2>
      <div class="color-strip" style="margin:12px auto 22px"></div>
      <div>
        <a class="career-chip" href="colleges.html?q=medical"><i class="fa-solid fa-stethoscope"></i><span data-i18n="job_doc"></span></a>
        <a class="career-chip" href="colleges.html?q=engineering"><i class="fa-solid fa-microchip"></i><span data-i18n="job_eng"></span></a>
        <a class="career-chip" href="courses.html?level=12"><i class="fa-solid fa-chalkboard-user"></i><span data-i18n="job_teach"></span></a>
        <a class="career-chip" href="colleges.html?q=commerce"><i class="fa-solid fa-briefcase"></i><span data-i18n="job_biz"></span></a>
        <a class="career-chip" href="courses.html?level=pg"><i class="fa-solid fa-flask"></i><span data-i18n="job_sci"></span></a>
        <a class="career-chip" href="colleges.html?q=design"><i class="fa-solid fa-palette"></i><span data-i18n="job_des"></span></a>
        <a class="career-chip" href="colleges.html?q=law"><i class="fa-solid fa-scale-balanced"></i><span data-i18n="job_law"></span></a>
        <a class="career-chip" href="colleges.html?q=nursing"><i class="fa-solid fa-user-nurse"></i><span data-i18n="job_nurse"></span></a>
      </div>
    </div>
  </section>

  <!-- TESTIMONIALS -->
  <section class="block wrap">
    <div class="sec-head">
      <div>
        <span class="kicker"><span class="dot bg-orange"></span> <span data-i18n="testi_kicker"></span></span>
        <h2 data-i18n="testi_t"></h2>
        <div class="color-strip"></div>
      </div>
    </div>
    <div class="grid c3" id="testiGrid"></div>
  </section>

  <!-- CITY BAND -->
  <section class="block wrap">
    <div class="sec-head">
      <div>
        <span class="kicker"><span class="dot bg-red"></span> <span data-i18n="kicker_city"></span></span>
        <h2 data-i18n="city_title"></h2>
        <div class="color-strip"></div>
        <p class="sub" style="margin-top:8px" data-i18n="city_sub"></p>
      </div>
      <a class="hbadge atlas-open" href="districts.html"><i class="fa-solid fa-map"></i> <span data-i18n="nav_atlas"></span> <i class="fa-solid fa-arrow-right" style="font-size:.68rem"></i></a>
    </div>
    <div class="city-band" id="cityStrip"></div>
  </section>

  <!-- ══════════ CTA BANNER ══════════ -->
  <section class="block wrap">
    <div class="cta-banner reveal">
      <div class="txt">
        <h2 data-i18n="cta_t"></h2>
        <p data-i18n="cta_d"></p>
        <div class="btns">
          <a href="colleges.html" class="btn" data-i18n="cta_b1"></a>
          <a href="courses.html" class="btn ghost" data-i18n="cta_b2"></a>
        </div>
      </div>
      <img src="images/graduate.jpg?v=11" alt="Graduate" onerror="this.style.display='none'">
    </div>
  </section>

  <!-- QUIZ MODAL -->
  <div class="overlay" id="quizOverlay">
    <div class="modal">
      <button class="close-x" onclick="closeModals()">✕</button>
      <h2 data-i18n="quiz_title"></h2>
      <p class="sub" data-i18n="quiz_sub"></p>
      <form id="quizForm" style="margin-top:16px">
        <div class="quiz-q">
          <h4 data-i18n="q1"></h4>
          <div class="quiz-opt">
            <label><input type="radio" name="qInterest" value="tech"> <span data-i18n="q1a"></span></label>
            <label><input type="radio" name="qInterest" value="med"> <span data-i18n="q1b"></span></label>
            <label><input type="radio" name="qInterest" value="arts"> <span data-i18n="q1c"></span></label>
            <label><input type="radio" name="qInterest" value="biz"> <span data-i18n="q1d"></span></label>
          </div>
        </div>
        <div class="quiz-q">
          <h4 data-i18n="q2"></h4>
          <div class="quiz-opt">
            <label><input type="radio" name="qStyle" value="practical"> <span data-i18n="q2a"></span></label>
            <label><input type="radio" name="qStyle" value="theory"> <span data-i18n="q2b"></span></label>
            <label><input type="radio" name="qStyle" value="research"> <span data-i18n="q2c"></span></label>
          </div>
        </div>
        <div class="quiz-q">
          <h4 data-i18n="q3"></h4>
          <div class="quiz-opt">
            <label><input type="radio" name="qTime" value="short"> <span data-i18n="q3a"></span></label>
            <label><input type="radio" name="qTime" value="degree"> <span data-i18n="q3b"></span></label>
            <label><input type="radio" name="qTime" value="long"> <span data-i18n="q3c"></span></label>
          </div>
        </div>
        <button class="btn block" data-i18n="quiz_submit"></button>
        <div class="quiz-result" id="quizResult" style="display:none"></div>
      </form>
    </div>
  </div>

  <!-- quick-view modal -->
  <div class="overlay" id="quickOverlay">
    <div class="modal">
      <button class="close-x" onclick="closeModals()">✕</button>
      <div id="quickBody"></div>
    </div>
  </div>

  <script src="js/data.js?v=17"></script>
  <script src="js/i18n.js?v=17"></script>
  <script src="js/app.js?v=17"></script>
  <script src="js/home.js?v=17"></script>
</body>
</html>
