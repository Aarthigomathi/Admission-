<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KalviPortal — All Tamil Nadu Colleges</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Baloo+Thambi+2:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Mukta+Malar:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>

  <section class="block wrap">
    <div class="sec-head">
      <div>
        <span class="kicker"><span class="dot bg-orange"></span> <span data-i18n="kicker_dir"></span></span>
        <h2 data-i18n="col_title"></h2>
        <div class="color-strip"></div>
        <p class="sub" style="margin-top:9px" data-i18n="col_sub"></p>
      </div>
      <span class="hbadge" id="countNote">…</span>
    </div>

    <div class="city-banner" id="cityBanner" style="display:none">
      <span id="bannerText"></span>
    </div>

    <div class="filter-bar">
      <input type="search" id="fSearch" data-i18n-ph="search_ph">
      <select id="fCity"></select>
      <select id="fCat"></select>
      <label class="chk"><input type="checkbox" id="fOnlyFav"> <span data-i18n="only_fav"></span></label>
    </div>

    <div class="grid c3" id="grid"></div>
  </section>

  <!-- compare bar -->
  <div class="compare-bar" id="compareBar">
    <b id="cmpLabel"></b>
    <span id="cmpNames"></span>
    <span style="margin-left:auto;display:flex;gap:8px">
      <button class="btn sm" id="cmpGo"></button>
      <button class="btn sm ghost" id="cmpClear"></button>
    </span>
  </div>

  <!-- modals -->
  <div class="overlay" id="quickOverlay">
    <div class="modal">
      <button class="close-x" onclick="closeModals()">✕</button>
      <div id="quickBody"></div>
    </div>
  </div>
  <div class="overlay" id="compareOverlay">
    <div class="modal">
      <button class="close-x" onclick="closeModals()">✕</button>
      <h2 data-i18n="compare_title"></h2>
      <div id="compareBody" style="margin-top:15px;overflow-x:auto"></div>
    </div>
  </div>

  <script src="js/data.js?v=16"></script>
  <script src="js/i18n.js?v=16"></script>
  <script src="js/app.js?v=16"></script>
  <script src="js/colleges.js?v=16"></script>
</body>
</html>
